<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MILU — терапевтические сказки для детей</title>
<meta name="description" content="Милу: персональные терапевтические сказки на ночь для детей 2–9 лет и дневник эмоций для родителей. Приложение для iPhone.">
<style>
:root{--cream:#FFF8EE;--paper:#FFFCF6;--ink:#2A2440;--ink-soft:#5C5470;--mute:#9C95B0;--lav:#8A7FE0;--wash:#F5F0FF;--line:#EFEAE0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(60% 50% at 20% 0%,rgba(138,127,224,.08),transparent),radial-gradient(50% 40% at 90% 10%,rgba(255,180,140,.08),transparent)}
main{max-width:640px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:48px 40px;text-align:center}
.mark{font-weight:800;letter-spacing:.18em;color:var(--lav);font-size:14px}
h1{font-size:30px;line-height:1.25;margin:14px 0 10px}
p{color:var(--ink-soft);max-width:46ch;margin:0 auto}
.rabbit{font-size:44px;margin-top:6px}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
nav a{display:inline-block;padding:10px 18px;border-radius:999px;background:var(--wash);color:var(--lav);text-decoration:none;font-weight:600;font-size:15px}
nav a:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
footer{margin-top:26px;font-size:13px;color:var(--mute)}
footer a{color:var(--mute)}
</style>
</head>
<body>
<main>
  <div class="mark">MILU</div>
  <div class="rabbit" aria-hidden="true">🐰</div>
  <h1>Терапевтические сказки, которые растят вашего ребёнка</h1>
  <p>Милу: персональные сказки на ночь для детей 2–9 лет и честный дневник эмоций для родителей. Приложение для iPhone уже в пути в App Store.</p>
  <nav aria-label="Разделы">
    <a href="support">Поддержка</a>
    <a href="policy">Конфиденциальность</a>
    <a href="terms">Условия</a>
  </nav>
  <footer>MILU · <a href="mailto:hello@millu.tech">hello@millu.tech</a></footer>
</main>
</body>
</html>
